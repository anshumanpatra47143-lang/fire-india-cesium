<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fire India World — 3D Map</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#101820; }
    #status {
      position:absolute; z-index:10; top:12px; left:12px; right:12px;
      box-sizing:border-box; padding:12px 14px; border-radius:10px;
      color:#fff; background:rgba(0,0,0,.82); font:16px/1.4 system-ui, sans-serif;
      overflow-wrap:anywhere;
    }
    #retry {
      margin-top:10px; padding:10px 16px; font-size:16px; border:0;
      border-radius:5px; background:#f2f2f2; color:#111;
    }
    #title {
      position:absolute; z-index:5; bottom:12px; left:12px; padding:8px 11px;
      border-radius:8px; color:white; background:rgba(0,0,0,.55);
      font:600 14px system-ui,sans-serif; pointer-events:none;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="status">Loading India 3D map…</div>
  <div id="title">FIRE INDIA WORLD · 3D MAP</div>

  <script>
    // IMPORTANT: Put your NEW Cesium ion token between the quotes below.
    // Do not paste a token into public chats or screenshots.
    const CESIUM_ION_TOKEN = "PASTE_NEW_CESIUM_ION_TOKEN_HERE";

    const statusBox = document.getElementById("status");
    let viewer = null;

    function showError(message) {
      statusBox.replaceChildren();
      const text = document.createElement("div");
      text.textContent = "Map error: " + message;
      statusBox.appendChild(text);
      const retry = document.createElement("button");
      retry.id = "retry";
      retry.textContent = "Retry Map";
      retry.addEventListener("click", startMap);
      statusBox.appendChild(retry);
    }

    async function startMap() {
      statusBox.textContent = "Loading India 3D map…";
      try {
        if (!CESIUM_ION_TOKEN || CESIUM_ION_TOKEN === "PASTE_NEW_CESIUM_ION_TOKEN_HERE") {
          throw new Error("Add your Cesium ion access token in index.html first.");
        }

        Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;

        if (viewer) {
          viewer.destroy();
          viewer = null;
        }

        viewer = new Cesium.Viewer("cesiumContainer", {
          terrain: Cesium.Terrain.fromWorldTerrain(),
          animation: false,
          timeline: false,
          geocoder: true,
          homeButton: true,
          sceneModePicker: true,
          baseLayerPicker: true,
          navigationHelpButton: false,
          fullscreenButton: true,
          infoBox: false,
          selectionIndicator: false,
          shouldAnimate: false
        });

        viewer.scene.globe.enableLighting = true;
        viewer.scene.globe.depthTestAgainstTerrain = false;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(82.8, 22.8, 3500000),
          orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-65),
            roll: 0
          },
          duration: 2
        });

        statusBox.textContent = "India 3D map loaded. Use two fingers to zoom/rotate on mobile.";
        window.setTimeout(() => {
          if (statusBox && statusBox.isConnected) statusBox.style.display = "none";
        }, 5000);
      } catch (error) {
        console.error(error);
        showError(error && error.message ? error.message : String(error));
      }
    }

    window.addEventListener("load", () => {
      if (typeof Cesium === "undefined") {
        showError("CesiumJS library did not load. Check internet connection or CDN access.");
        return;
      }
      startMap();
    });
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
</body>
</html>
